# 1. ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_PORT: "8080"

---
# 2. Secret
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data: 
  API_KEY: bW9uX2NsZV9zZWNyZXRlXzEyMw==

---
# 3. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app-deployment
  labels:
    app: exercice-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exercice-app
  template:
    metadata:
      labels:
        app: exercice-app
    spec:
      containers:
      - name: web
        image: nginx:alpine
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_PORT
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: API_KEY